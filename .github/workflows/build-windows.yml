name: test-web

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      # GitHub Windows runners may default Python stdout/stderr to cp1252.
      # Keep CI output compatible with the repository's UTF-8 messages.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: 安装依赖
        run: |
          uv venv --python 3.11 .venv
          uv sync

      - name: 运行语法与回归检查
        run: |
          .venv\Scripts\python.exe -m compileall -q Agent Channel Message bridge core database service server utils
          .venv\Scripts\python.exe -m unittest discover -v
